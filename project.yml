name: HalfUnit
options:
  bundleIdPrefix: $(BUNDLE_ID_PREFIX)
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  knownRegions:
    - en
    - de
  developmentLanguage: en
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  HalfUnitCore:
    path: Packages/HalfUnitCore
targets:
  HalfUnit:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
      - path: Resources
    entitlements:
      path: Config/Entitlements/HalfUnit-iOS.entitlements
      properties:
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(BUNDLE_ID_PREFIX).halfunit
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).halfunit
    info:
      path: Config/Info/HalfUnit-iOS-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Never used (iPhone only); App Store validation requires all four for iPad.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        NSFaceIDUsageDescription: Half Unit uses Face ID to unlock the app.
        NSHealthShareUsageDescription: Half Unit does not read your Apple Health data. It only saves the drinks you log there.
        NSHealthUpdateUsageDescription: Half Unit saves each drink you log to Apple Health as alcoholic beverages.
        HalfUnitAppGroup: group.$(BUNDLE_ID_PREFIX).halfunit
        HalfUnitCloudKitContainer: iCloud.$(BUNDLE_ID_PREFIX).halfunit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).halfunit
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HalfUnitCore
      - target: HalfUnitWatch
        embed: true
      - target: HalfUnitWidgets
        embed: true
  HalfUnitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/WidgetsiOS
      - path: Apps/Shared
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Config/Entitlements/HalfUnit-Widgets.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(BUNDLE_ID_PREFIX).halfunit
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).halfunit
    info:
      path: Config/Info/HalfUnit-Widgets-Info.plist
      properties:
        CFBundleDisplayName: Half Unit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        HalfUnitAppGroup: group.$(BUNDLE_ID_PREFIX).halfunit
        HalfUnitCloudKitContainer: iCloud.$(BUNDLE_ID_PREFIX).halfunit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).halfunit.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: HalfUnitCore
  HalfUnitWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/watchOS
        excludes:
          - Info.plist
      - path: Apps/Shared
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Config/Entitlements/HalfUnit-watchOS.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(BUNDLE_ID_PREFIX).halfunit
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).halfunit
    info:
      path: Apps/watchOS/Info.plist
      properties:
        CFBundleDisplayName: Half Unit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).halfunit
        UIBackgroundModes:
          - remote-notification
        HalfUnitAppGroup: group.$(BUNDLE_ID_PREFIX).halfunit
        HalfUnitCloudKitContainer: iCloud.$(BUNDLE_ID_PREFIX).halfunit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).halfunit.watchkitapp
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HalfUnitCore
      - target: HalfUnitWatchWidgets
        embed: true
  HalfUnitWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Extensions/WidgetsWatch
      - path: Apps/Shared
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Config/Entitlements/HalfUnit-WatchWidgets.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(BUNDLE_ID_PREFIX).halfunit
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).halfunit
    info:
      path: Config/Info/HalfUnit-WatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Half Unit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        HalfUnitAppGroup: group.$(BUNDLE_ID_PREFIX).halfunit
        HalfUnitCloudKitContainer: iCloud.$(BUNDLE_ID_PREFIX).halfunit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).halfunit.watchkitapp.watchwidgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: HalfUnitCore
  HalfUnitWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Apps/watchOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).halfunit.watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HalfUnitWatch.app/HalfUnitWatch
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: HalfUnitWatch
      - package: HalfUnitCore
  HalfUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/iOSTests
      - path: Extensions/WidgetsiOS/HalfUnitHomeWidgetViews.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).halfunit.tests
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TESTING
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HalfUnit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HalfUnit
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: HalfUnit
      - package: HalfUnitCore
schemes:
  HalfUnit:
    build:
      targets:
        HalfUnit: all
        HalfUnitWidgets: all
        HalfUnitTests: [test]
    test:
      targets:
        - HalfUnitTests
  HalfUnitWatch:
    build:
      targets:
        HalfUnitWatch: all
        HalfUnitWatchWidgets: all
        HalfUnitWatchTests: [test]
    test:
      targets:
        - HalfUnitWatchTests
